RF:
{
  Async        = 2;   # = 0, frequency calibration based on GSM signals
                      # = 1, causes the RF to read data continously without any gaps, required for Time-of-Arrival (ToA) service
                      # = 2, (default) same as Async = 1 but latency is further reduced by 50%
  FreqPlan     = ${FREQ_PLAN};
  DeviceSerial = "${SDR_868_SERIAL}";
  FreqCorr     = ${SDR_868_PPM};
  SampleRate   = 2.0;
  BiasTee      = ${SDR_868_BIAS_T_ENABLE};

  GSM:
  { 
    CenterFreq  = ${GSM_CENTER_FREQ};
    Gain        = 40.2;
  };

  OGN:
  { 
    Gain       = 50.0;
    MinNoise   =  2.0;
    MaxNoise   = 10.0;
  } ;
};

Demodulator:
{ 
  ScanMargin = 30.0;
  DetectSNR  = 11.0;
  MergeServer = "${MERGE_SERVER}";
} ;

Position:
{ 
  Latitude   =    ${STATION_LAT};
  Longitude  =    ${STATION_LON};
  Altitude   =    ${STATION_ALT_MSL_M};
};

APRS:
{ 
  Call = "${STATION_NAME}";
  ToAserver = "${TOA_SERVER}"; # Time-of-Arrival server for OGN, requires Async = 1 or 2 in RF section
  
  Beacon:
  {
    Comment = [
      "antenna: ${STATION_COMMENT_ANTENNA}",
      "filter: ${STATION_COMMENT_FILTER}",
      "amplifier: ${STATION_COMMENT_AMPLIFIER}",
      "dongle: ${STATION_COMMENT_DONGLE}",
      "club: ${STATION_COMMENT_CLUB}",
      "email: ${STATION_COMMENT_EMAIL}",
      "website: ${STATION_COMMENT_WEBSITE}",
      "note: ${STATION_COMMENT_NOTE}"
    ] ;
  } ;
};

HTTP:
{ 
  Port = 8080;
};

# Optional: feed the ADS-B traffic that this site receives into the Open Glider
# Network. ADSB_AVR points at a raw/AVR output (e.g. readsb's port 30002).
# When ADSB_AVR is empty this whole block is removed by startup.sh, so the
# ADS-B feed stays off unless it is explicitly configured.
ADSB:
{
  AVR    = "${ADSB_AVR}";
  MaxAlt = ${ADSB_MAX_ALT_FT};
};
